# Sugarcube experiment: Pokémon Crystal wrapped around the 30 mm die.
#
# This is its own Cargo workspace, on purpose: nothing in the product
# workspace (the repo root) depends on it, `cargo build` at the root never
# sees it, and its Cargo.lock is separate. It borrows two product crates by
# path (the HAL's face/pixel types and the core's face axes) so the cube
# geometry matches the firmware's, but the dependency only points this way.
[workspace]
resolver = "2"
members = ["core", "emu", "demo", "sim", "ffi"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
gbc-cube-core = { path = "core" }
gbc-cube-emu = { path = "emu" }
gbc-cube-demo = { path = "demo" }
smokebomb-hal = { path = "../../packages/firmware/hal" }
smokebomb-core = { path = "../../packages/firmware/core" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
cc = "1"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
# The emulator and the face renderer run every frame at 60 Hz; a plain debug
# build can't keep up.
opt-level = 2

[profile.release]
debug = 1

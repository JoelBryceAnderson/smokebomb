name: CI · Mobile

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packages/mobile/**"
      # The iOS app links the firmware core (packages/firmware/ffi).
      - "packages/firmware/**"
      - "packages/shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-mobile.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/mobile

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :shared:testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew :composeApp:assembleDebug

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests (iOS simulator)
        run: ./gradlew :shared:iosSimulatorArm64Test
      - name: Link Compose framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Rust targets for iOS (the app links the firmware core)
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: Build app (simulator, unsigned)
        working-directory: packages/mobile/iosApp
        run: |
          xcodebuild -project iosApp.xcodeproj -target iosApp -configuration Debug \
            -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO build
      - name: AR viewer tests (simulator)
        working-directory: packages/mobile/iosApp
        run: |
          # The first available iPhone simulator; device names change between runner images.
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True) if "iOS" in runtime
                     for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild test -project iosApp.xcodeproj -scheme ARViewerTests \
            -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO

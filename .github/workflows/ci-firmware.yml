name: CI · Firmware & Simulator

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packages/firmware/**"
      - "packages/shared/**"
      - "packages/simulator/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - ".cargo/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-firmware.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  firmware:
    name: Firmware core + HAL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (host crates)
        run: cargo clippy -p smokebomb-shared -p smokebomb-core -p smokebomb-hal -p smokebomb-hal-simulator -p smokebomb-hal-nrf54l15 -p smokebomb-assets-build --all-targets -- -D warnings
      - name: Clippy (firmware, simulator board)
        run: cargo clippy -p smokebomb-firmware --features simulator -- -D warnings
      - name: Clippy (firmware, nRF54L15 board)
        run: cargo clippy -p smokebomb-firmware --no-default-features --features nrf54l15 --target thumbv8m.main-none-eabihf -- -D warnings
      - name: Clippy (Zephyr static library, and its benchmark and bring-up builds)
        run: |
          cargo clippy -p smokebomb-zephyr --target thumbv8m.main-none-eabihf -- -D warnings
          cargo clippy -p smokebomb-zephyr --target thumbv8m.main-none-eabihf --features bench -- -D warnings
          cargo clippy -p smokebomb-zephyr --target thumbv8m.main-none-eabihf --features bringup -- -D warnings
      - name: Test (includes the screen snapshots and the panel driver's bytes)
        run: cargo test -p smokebomb-shared -p smokebomb-core -p smokebomb-hal -p smokebomb-hal-simulator -p smokebomb-hal-nrf54l15 -p smokebomb-assets-build
      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: target/snapshot-diffs/*.png
          if-no-files-found: ignore
      - name: Build nRF54L15 image (no_std)
        run: cargo fw
      - name: Size report
        run: |
          ls -l target/thumbv8m.main-none-eabihf/firmware/*.rlib | tee -a "$GITHUB_STEP_SUMMARY"

  simulator:
    name: Simulator (server + web UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Web UI typecheck + build
        run: npx nx run simulator-web-ui:build
      - name: Clippy
        run: cargo clippy -p smokebomb-simulator --all-targets -- -D warnings
      - name: Test (world model + firmware end to end)
        run: cargo test -p smokebomb-simulator
      - name: Build simulator
        run: cargo build --features=simulator
      - name: Smoke test
        run: |
          cargo run --features=simulator &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/state && break; sleep 1; done
          curl -sf localhost:3000/ | grep -q "Sugarcube Simulator"
          curl -sf localhost:3000/api/device

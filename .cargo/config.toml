[alias]
# Simulator: firmware core + simulator HAL, web UI on http://localhost:3000
sim = "run -p smokebomb-simulator --features simulator"
# Firmware image for the nRF54L15 (Cortex-M33, hard-float)
fw = "build -p smokebomb-firmware --no-default-features --features nrf54l15 --target thumbv8m.main-none-eabihf --profile firmware"
# The same for the 30 mm die's 64x64 RGB panels (TARGET_30_RGB64)
fw30 = "build -p smokebomb-firmware --no-default-features --features target-30-rgb64 --target thumbv8m.main-none-eabihf --profile firmware"

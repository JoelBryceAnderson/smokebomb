<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smokebomb 3D mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
  :root {
    --stage-top: #E6E8EB;
    --stage-bottom: #C7CBD0;
    --ink: #1B1D20;
    --ink-soft: #4F545B;
    --chip: #F3F4F6;
    --chip-line: #B5BAC0;
    --chip-on: #1B1D20;
    --chip-on-ink: #F3F4F6;
    --button: #1B1D20;
    --button-ink: #F3F4F6;
    --crit: #8A5A12;
    --dud: #9C3F22;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --stage-top: #262A30;
      --stage-bottom: #0E1013;
      --ink: #E9EBEE;
      --ink-soft: #A0A6AD;
      --chip: #1D2025;
      --chip-line: #3B4047;
      --chip-on: #D6DADF;
      --chip-on-ink: #15171A;
      --button: #D6DADF;
      --button-ink: #15171A;
      --crit: #F2C66B;
      --dud: #E0876A;
    }
  }
  :root.dark-room { --stage-top: #111214; --stage-bottom: #030304; }
  :root[data-theme="dark"] {
    --stage-top: #262A30;
    --stage-bottom: #0E1013;
    --ink: #E9EBEE;
    --ink-soft: #A0A6AD;
    --chip: #1D2025;
    --chip-line: #3B4047;
    --chip-on: #D6DADF;
    --chip-on-ink: #15171A;
    --button: #D6DADF;
    --button-ink: #15171A;
    --crit: #F2C66B;
    --dud: #E0876A;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    background: radial-gradient(120% 90% at 50% 30%, var(--stage-top), var(--stage-bottom));
    color: var(--ink);
    font-family: "Space Grotesk", "Trebuchet MS", Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .stage { position: relative; height: 100%; display: flex; flex-direction: column; }
  canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas#c:active { cursor: grabbing; }
  .brand { position: relative; padding: 20px 24px 0; pointer-events: none; }
  .brand h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .brand p { margin: 2px 0 0; font-size: 15px; color: var(--ink-soft); }
  .controls {
    position: relative; margin-top: auto; padding: 0 20px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    pointer-events: none;
  }
  .controls > * { pointer-events: auto; }
  .result { min-height: 24px; font-size: 17px; font-weight: 500; text-align: center; }
  .result.crit { color: var(--crit); }
  .result.dud { color: var(--dud); }
  .types { display: flex; flex-wrap: nowrap; justify-content: safe center; gap: 6px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .types::-webkit-scrollbar { display: none; }
  .types button { flex: none; }
  .actions { display: flex; gap: 8px; width: min(440px, 100%); }
  /* chip rows: one line each, full width, swipe sideways when they don't fit */
  .views {
    display: flex; flex-wrap: nowrap; gap: 6px; pointer-events: auto;
    margin: 0 -24px; padding: 4px 24px; scroll-padding: 0 24px;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 28px), transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 28px), transparent 100%);
  }
  .views::-webkit-scrollbar { display: none; }
  .views::after { content: ""; flex: none; width: 1px; } /* keeps the end padding when scrolled fully */
  .views button { flex: none; white-space: nowrap; }
  #views { margin-top: 8px; }
  .corner { position: absolute; top: 16px; right: 16px; z-index: 2; display: flex; gap: 8px; }
  .round {
    width: 44px; height: 44px; border-radius: 22px;
    display: grid; place-items: center; padding: 0; cursor: pointer;
    border: 1px solid var(--chip-line); background: var(--chip); color: var(--ink);
  }
  .round[aria-pressed="true"]:not(.lights) { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
  .round svg { width: 22px; height: 22px; }
  .brand h1 { padding-right: 160px; } /* clear the corner buttons; chip rows use the full width */
  .brand p { margin-top: 10px; }
  .views button {
    font: inherit; font-size: 14px; font-weight: 500; height: 34px; padding: 0 12px;
    border-radius: 17px; border: 1px solid var(--chip-line); background: var(--chip); color: var(--ink); cursor: pointer;
  }
  .views button[aria-checked="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
  @media (max-height: 720px) { .hint, .brand p { display: none; } .controls { gap: 10px; } }
  .types button {
    font: inherit; font-size: 15px; font-weight: 500;
    min-width: 48px; height: 40px; padding: 0 12px;
    border-radius: 20px; border: 1px solid var(--chip-line);
    background: var(--chip); color: var(--ink); cursor: pointer;
  }
  .types button[aria-checked="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
  .throw {
    font: inherit; font-size: 18px; font-weight: 700;
    flex: 1; min-width: 0; height: 56px; border: 0; border-radius: 14px;
    background: var(--button); color: var(--button-ink); cursor: pointer;
  }
  .throw:disabled { opacity: 0.6; cursor: default; }
  #throw { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .secondary {
    font: inherit; font-size: 16px; font-weight: 500;
    flex: none; padding: 0 16px; height: 56px; border-radius: 14px;
    border: 1px solid var(--chip-line); background: transparent; color: var(--ink); cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--crit); outline-offset: 3px; }
  .hint { margin: 0; font-size: 14px; color: var(--ink-soft); text-align: center; }
</style>
</head>
<body>
<main class="stage">
  <canvas id="c" aria-label="A 3D Smokebomb die: a soft rounded metal shell with six rounded black glass screens. Drag to turn it."></canvas>
  <div class="corner">
    <button class="round" id="pixelsBtn" type="button" aria-pressed="true" aria-label="True 96 by 96 display"></button>
    <button class="round" id="zoomBtn" type="button" aria-pressed="false" aria-label="Close-up"></button>
    <button class="round lights" id="lightsBtn" type="button" aria-pressed="false" aria-label="Turn the lights off"></button>
  </div>
  <header class="brand">
    <h1>Smokebomb</h1>
    <p>34mm mockup · true 96×96 4-bit screens</p>
    <div class="views" role="radiogroup" aria-label="View" id="views"></div>
    <div class="views" role="radiogroup" aria-label="Finish" id="finishes"></div>
  </header>
  <section class="controls">
    <div class="result" id="result" aria-live="polite"></div>
    <div class="types" role="radiogroup" aria-label="Die type" id="types"></div>
    <div class="actions">
      <button class="throw" id="throw">Throw a Smokebomb</button>
      <button class="secondary" id="menu" type="button">Menu</button>
    </div>
    <p class="hint">Press and hold any screen for the menu.</p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- studio environment for the aluminum ----------

    panel(8, 8, [0, 12, 0], 0xffffff, 1.4);      // soft overhead

  const ambient = new THREE.AmbientLight(0xffffff, 0.15); scene.add(ambient);

    const ty = new THREE.Mesh(tubeGeo[1], alu); ty.position.set(a, 0, b); usmFrame.add(ty);
    const tz = new THREE.Mesh(tubeGeo[2], alu); tz.position.set(a, b, 0); usmFrame.add(tz);

  const ballGeo = new THREE.SphereGeometry(BALL, 32, 20);

  });

    const ex = new THREE.Mesh(softEdge[0], alu); ex.position.set(0, a, b); softFrame.add(ex);
    const ey = new THREE.Mesh(softEdge[1], alu); ey.position.set(a, 0, b); softFrame.add(ey);
    const ez = new THREE.Mesh(softEdge[2], alu); ez.position.set(a, b, 0); softFrame.add(ez);

  const softCorner = new THREE.SphereGeometry(RE, 32, 20);
  [-EC, EC].forEach(x => [-EC, EC].forEach(y => [-EC, EC].forEach(z => {

    new THREE.MeshStandardMaterial({ color: 0x151618, metalness: 0.4, roughness: 0.6 })));
  // rounded-corner glass panel, UVs mapped to the full 2x2 face canvas
  const panelShape = new THREE.Shape();
  (function (s, h, r) {
    s.moveTo(-h + r, -h); s.lineTo(h - r, -h); s.quadraticCurveTo(h, -h, h, -h + r);

  const windowHole = new THREE.Path();

  const holeSoft = new THREE.Path(); rr(holeSoft, 0.906, 0.19); plateShapeSoft.holes.push(holeSoft);
  const plateGeoSoft = new THREE.ExtrudeGeometry(plateShapeSoft, { depth: 0.02, bevelEnabled: false, curveSegments: 16 });

    const pos = geo.attributes.position, uv = geo.attributes.uv;
    for (let i = 0; i < pos.count; i++) uv.setXY(i, (pos.getX(i) + 1) / 2, (pos.getY(i) + 1) / 2);
    uv.needsUpdate = true;

  const OUT_T = 444, OUT_PX = 3, OUT_OFF = (OUT_T - 96 * OUT_PX) / 2; // 288px lit area = the real 17.26mm square

    { n: [1, 0, 0], rot: [0, Math.PI / 2, 0] },
    { n: [-1, 0, 0], rot: [0, -Math.PI / 2, 0] },
    { n: [0, 1, 0], rot: [-Math.PI / 2, 0, 0] },
    { n: [0, -1, 0], rot: [Math.PI / 2, 0, 0] },
    { n: [0, 0, 1], rot: [0, 0, 0] },

  function d20() {

    const p = geo.attributes.position, a = new THREE.Vector3().fromBufferAttribute(p, 0),

  }
  VIEWS.forEach(([v, t]) => {
    const b = document.createElement("button"); b.type = "button"; b.dataset.v = v; b.textContent = t;
    b.setAttribute("role", "radio"); b.setAttribute("aria-checked", v === "die" ? "true" : "false");
    b.addEventListener("click", () => setView(v)); viewsEl.appendChild(b);
  });
  window.addEventListener("resize", resize);

  // ---------- loop ----------
  const ease = x => 1 - Math.pow(1 - x, 3);
  const spinQ = new THREE.Quaternion();
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05); now += dt;

    // pre-roll shake: the die jitters in the hand while smoke fills every screen and sloshes around
    agitate = 0;
    if (shaking && phase !== "tumble") {
      charge = Math.min(1, charge + dt / 1.6);
      agitate = 3 + charge * 3;
      if (!reduced) {
        rotateBy((Math.random() - 0.5) * 0.12, (Math.random() - 0.5) * 0.12);
        die.position.x += (Math.random() - 0.5) * 0.06; die.position.y = Math.abs(Math.sin(now * 23)) * 0.08;
      }
      sloshL.set(Math.sin(now * 17), Math.cos(now * 13), Math.sin(now * 11 + 1)).multiplyScalar(2.5).applyQuaternion(qInv);
      const target = Math.round((reduced ? 150 : 380) * charge);
      const held = particles.reduce((a, q) => a + (q.hold ? 1 : 0), 0);
      if (held < target) {
        const before = particles.length;
        spawn("smoke", Math.min(14, target - held), "all");
        for (let i = before; i < particles.length; i++) particles[i].hold = true;
      }
      lastInteract = now;
    } else if (!shaking && phase !== "tumble" && particles.some(q => q.hold)) {
      // put down without throwing: the smoke settles and fades
      particles.forEach(q => { if (q.hold) { q.hold = false; q.life = q.max * 0.35; } });
      charge = 0;
    }
    if (phase === "tumble") {
      agitate = 5; sloshL.set(0, 0, 0);
      const u = Math.min(1, (now - roll.start) / roll.dur), e = ease(u);
      die.quaternion.copy(roll.startQ).slerp(roll.targetQ, e);
      if (!reduced) { spinQ.setFromAxisAngle(roll.axis, (1 - e) * Math.PI * 4); die.quaternion.premultiply(spinQ); }
      die.position.y = reduced ? 0 : Math.abs(Math.sin(Math.PI * 2.5 * u)) * Math.pow(1 - u, 2) * 1.6;
      if (u >= 1) {
        die.position.y = 0; phase = "reveal"; flashAt = now;
        die.updateMatrixWorld(); qInv.copy(die.quaternion).invert(); upL.set(0, 1, 0).applyQuaternion(qInv);
        // held smoke from the shake now drains away; top up only what the shake didn't already fill
        particles.forEach(q => { if (q.hold) { q.hold = false; q.life = 0; q.max = 2.0 + Math.random() * 1.4; q.linger = now + 0.6; } });
        const before = particles.length;
        spawn("smoke", Math.round((reduced ? 150 : 380) * (1 - 0.8 * charge)), "all");
        for (let i = before; i < particles.length; i++) particles[i].linger = now + 0.6;
        spawn("ember", reduced ? 10 : 36, "all");
        charge = 0;
        revealAt = now + 0.35; dimAt = revealAt + 7;
      }
    } else if (!dragging && !docked() && !menuOpen && !snap) {
      if (spin.lengthSq() > 1e-7) { rotateBy(spin.x, spin.y); spin.multiplyScalar(0.92); }
      else if (!reduced && now - lastInteract > 4) { qd.setFromAxisAngle(Y, dt * 0.18); die.quaternion.premultiply(qd); }
    }

    if (snap) {
      const u = Math.min(1, (now - snap.start) / snap.dur);
      die.quaternion.copy(snap.startQ).slerp(snap.targetQ, ease(u));
      if (u >= 1) { die.quaternion.copy(snap.targetQ); snap = null; }
    }
    if (tip) {
      const u = Math.min(1, (now - tip.start) / tip.dur);
      die.quaternion.copy(tip.startQ).slerp(tip.targetQ, ease(u));
      die.position.y = Math.sin(Math.PI * u) * 0.12;
      if (u >= 1) { die.quaternion.copy(tip.targetQ); die.position.y = 0; menu = tip.next; menuPf = tip.to; tip = null; }
    }
    if (menuOpen && holding && !swiped && !tip && !snap && now - holdStart >= HOLD) {
      holding = false; closeMenu(true); flashAt = now; pulseAt = now; buzz(28);
    }
    if (!menuOpen && holding && viewMode === "die" && phase !== "tumble" && !pendingBoot && now - holdStart >= HOLD) {
      holding = false; openMenu(holdFace); pulseAt = now; buzz([18, 40, 26]);
    }
    const pu = pulseAt > 0 ? (now - pulseAt) / 0.28 : 1;
    die.scale.setScalar(pu < 1 ? 1 + 0.035 * Math.sin(Math.PI * pu) : 1);
    if (menuOpen && !tip && now - menuLastInput > 25) closeMenu(false);

    if (phase === "reveal" && now >= revealAt && roll) {
      phase = "idle"; throwBtn.disabled = false;
      const t = roll.type, v = roll.values, numeric = t !== "lcr";
      const total = numeric ? v.reduce((a, b) => a + b, 0) : 0;
      const max = numeric && t > 2 && v.every(x => x === t), dud = numeric && v.every(x => x === 1);
      const lab = setupLabel(roll.count, t);
      const big = numeric ? String(total) : v.join(" ");
      const desc = !numeric ? `Pass the Pot: ${v.map(x => POT_WORD[x]).join(", ")}` : v.length > 1 ? `Rolled ${lab}: ${v.join(" + ")} = ${total}` : `Rolled ${total} on a d${t}`;
      const parts = numeric && v.length > 1 && v.join("+").length <= 18 ? v.join("+") : "";
      resultShown = { big, label: lab, parts, max, dud, special: false, desc, tokens: numeric ? null : v };
      pendingSpecial = max ? "max" : dud ? "dud" : null;
      trail.unshift(numeric ? `${total} on ${lab}` : v.map(x => POT_WORD[x]).join("/")); trail.length = Math.min(trail.length, 4);
      setResultText("");
    }

    // max and dud effects wait until the smoke has fully cleared
    if (pendingSpecial && resultShown && phase === "idle" && !particles.some(q => q.kind === "smoke" || q.kind === "ember")) {
      if (pendingSpecial === "max") spawn("gold", reduced ? 40 : 120, "ring");
      else spawn("fizzle", reduced ? 12 : 36, "top");
      resultShown.special = true; dimAt = Math.max(dimAt, now + 5);
      setResultText(pendingSpecial === "max" ? " crit" : " dud");
      pendingSpecial = null;
    }

    die.updateMatrixWorld();
    qInv.copy(die.quaternion).invert();
    upL.set(0, 1, 0).applyQuaternion(qInv);
    camLocal.copy(camera.position).sub(die.position).applyQuaternion(qInv);
    stepParticles(dt, now);

    const k = 1 - Math.exp(-6 * dt);
    if (iri.on.value > 0.5) {
      // a gentle extra drift tied to the die's orientation (its axes in the world, which never jump)
      tintX.set(1, 0, 0).applyQuaternion(die.quaternion); tintZ.set(0, 0, 1).applyQuaternion(die.quaternion);
      iri.shift.value = tintX.z * 0.12 + tintZ.y * 0.1;
    }
    const tx = viewMode === "sizes" ? compareDieX : viewMode === "egg" ? -SLOT : 0;
    die.position.x += (tx - die.position.x) * k; die.position.z += (0 - die.position.z) * k;
    if (docked() && phase !== "tumble") die.quaternion.slerp(IDENTITY_Q, k);
    die2.position.set(SLOT, die.position.y, 0); die2.quaternion.copy(die.quaternion);
    shadow.visible = !docked();
    camera.position.lerp(camTargetPos, k); camLook.lerp(camTargetLook, k); camera.lookAt(camLook);
    shadow.position.x = die.position.x;
    shadow.scale.setScalar(1 - Math.min(0.35, die.position.y * 0.25));
    shadow.material.opacity = 1 - Math.min(0.6, die.position.y * 0.4);

    // draw every face; the face turned most toward the viewer is the primary screen
    const uf = upFace();
    let pf = 0, pd = -2;
    frontTmp.copy(camLocal).normalize();
    faces.forEach(g => { const d = g.normal.dot(frontTmp); if (d > pd) { pd = d; pf = g.i; } });
    if (pf !== lastPf && faces[lastPf].normal.dot(frontTmp) > pd - 0.15) pf = lastPf;
    if (menuOpen) pf = tip ? tip.to : menuPf;
    lastPf = pf;
    const resA = resultShown && revealAt > 0
      ? Math.min(1, (now - revealAt) / 0.9) * (now < dimAt ? 1 : Math.max(0, 1 - (now - dimAt) / 1.2)) : 0;
    const wakeA = now < wakeUntil ? Math.min(1, (now - wakeStart) / 0.35, (wakeUntil - now) / 0.6) : 0;
    const flashA = flashAt > 0 ? Math.max(0, 1 - (now - flashAt) / 0.25) : 0;
    if (!bootDone && !bootBurst && now - bootStart >= LOOP_END + BURST_AT) { bootBurst = true; spawnBurst(bootTop); }
    if (pendingBoot && now >= rebootUntil) { pendingBoot = false; startBoot(); }
    if (!bootDone && (now - bootStart >= BOOT_DUR || phase === "tumble" || menuOpen)) { bootDone = true; if (!menuOpen && phase !== "tumble") { wake(2.2); showSetup(); } }

    for (const f of faces) {
      const ctx = f.ctx;
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, S, S);
      if (pendingBoot) continue; // powered off during a restart
      if (flashA > 0) { ctx.globalAlpha = flashA * 0.35; ctx.fillStyle = "#e8ecf2"; ctx.fillRect(0, 0, S, S); }
      const ang = textAngle(f, uf);
      if (!menuOpen && menuFade && !docked()) drawMenuFade(f, ctx, ang);
      if (!menuOpen && holding && viewMode === "die" && f.i === holdFace && now - holdStart > HOLD_SHOW)
        drawHoldRing(ctx, ang, Math.min(1, (now - holdStart - HOLD_SHOW) / (HOLD - HOLD_SHOW)));
      const booting = !bootDone && !docked() && !menuOpen && phase !== "tumble";
      if (booting) {
        drawBootFace(f, ctx, ang);
      } else if (docked()) {
        if (f.i === uf) drawCharge(ctx, ang);
        else if (viewMode === "nest" && f.axis !== faces[uf].axis) drawClock(ctx, ang);
      } else if (menuOpen) {
        drawMenuFace(f, ctx, ang, pf);
      } else if (resA > 0 && f.i !== faceIndex(faces[uf].axis, -faces[uf].sign)) {
        const r = resultShown, fx = r.special;
        const color = fx && r.dud ? "#8A8C90" : "#F4F5F7";
        const label = fx && r.max ? `max ${r.label}` : fx && r.dud ? "dud" : r.label;
        drawResult(ctx, ang, r, label, color, resA);
      } else if (confirmAt > 0 && now - confirmAt < 1.3 && f.i === successPf && phase !== "tumble") {
        drawSuccess(ctx, ang, confirmLabel, now - confirmAt);
      } else if (wakeA > 0 && phase !== "tumble") {
        const lab = setupLabel();
        drawText(ctx, ang, null, lab, "#F4F5F7", wakeA * 0.85, "#F4F5F7", null, fitPx(lab, 50));
      }
    }
    // smoke over the faces, wrapping across edges
    for (const f of faces) { f.ctx.globalCompositeOperation = "lighter"; }
    for (const q of particles) {
      const lifeT = q.life / q.max;
      const fadeIn = Math.min(1, q.life / 0.12);
      const alpha = (q.kind === "gold" ? Math.pow(Math.sin(Math.PI * lifeT), 0.8) : fadeIn * Math.pow(1 - lifeT, 0.8)) *
        (q.kind === "smoke" ? 0.55 : q.kind === "fizzle" ? 0.3 : 0.9);
      const size = q.size * (1 + (q.kind === "smoke" || q.kind === "fizzle" ? lifeT * 1.4 : 0));
      const spr = SPR[q.kind];
      const own = faces[q.f];
      const draw = (face, pt) => {
        const [x, y] = toCanvas(face, pt);
        face.ctx.globalAlpha = alpha; face.ctx.drawImage(spr, x - size, y - size, size * 2, size * 2);
      };
      draw(own, q.p);
      const ru = size / (S / 2);
      for (const g of faces) {
        if (g.axis === own.axis) continue;
        const d = 1 - g.sign * q.p.getComponent(g.axis);
        if (d < ru) {
          tmp.copy(q.p); tmp.setComponent(own.axis, own.sign * (1 + d)); tmp.setComponent(g.axis, g.sign);
          draw(g, tmp);
        }
      }
    }
    // only the OLED active area lights up; the rest of the glass is bezel.
    // Output exactly what the panel can show: 96x96 pixels. In true-display mode each pixel is simply
    // one of 16 gray levels (SSD1317 4-bit grayscale).
    // The rounded corners come from a black ink mask on the cover glass.
    // Panels refresh at most 100 Hz, so on faster screens (120 Hz phones) frames are held.
    const panelNow = performance.now(), panelDue = panelNow - lastPanel >= 9.5;
    if (panelDue) lastPanel = panelNow;
    for (const f of faces) {
      if (!panelDue) break;
      lowCtx.imageSmoothingEnabled = true; lowCtx.clearRect(0, 0, OLED_PX, OLED_PX);
      lowCtx.drawImage(f.cv, S / 2 - ACTIVE, S / 2 - ACTIVE, ACTIVE * 2, ACTIVE * 2, 0, 0, OLED_PX, OLED_PX);
      if (trueDisplay) {
        const img = lowCtx.getImageData(0, 0, OLED_PX, OLED_PX), d = img.data;
        for (let p = 0, i = 0; p < OLED_PX * OLED_PX; p++, i += 4) {
          // 16 gray levels (4-bit), light ordered dither between neighbouring steps to hide banding
          const lvl = Math.min(15, Math.floor(Math.max(d[i], d[i + 1], d[i + 2]) / 255 * 15 + DITHER[p]));
          d[i] = d[i + 1] = d[i + 2] = lvl * 17; d[i + 3] = 255;
        }
        lowCtx.putImageData(img, 0, 0);
      }
      const o = f.outCtx;
      o.globalCompositeOperation = "source-over"; o.fillStyle = "#000"; o.fillRect(0, 0, OUT_T, OUT_T);
      o.imageSmoothingEnabled = false;
      o.drawImage(lowres, 0, 0, OLED_PX, OLED_PX, OUT_OFF, OUT_OFF, OLED_PX * OUT_PX, OLED_PX * OUT_PX);
      o.globalCompositeOperation = "destination-in";
      o.fillStyle = "#fff"; o.beginPath(); roundRectPath(o, OUT_OFF, OUT_OFF, OLED_PX * OUT_PX, OLED_PX * OUT_PX, 42); o.fill();
      o.globalCompositeOperation = "source-over";
      f.tex.needsUpdate = true;
    }

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  resize();
  die.quaternion.setFromEuler(new THREE.Euler(0, 0.35, 0));
  (document.fonts && document.fonts.load ? document.fonts.load('700 40px "Space Grotesk"') : Promise.resolve())
    .catch(() => {}).then(() => { startBoot(); requestAnimationFrame(frame); });
})();
</script>
</body>
</html>

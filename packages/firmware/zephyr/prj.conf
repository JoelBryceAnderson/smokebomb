# Core
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
# The Rust firmware is built for thumbv8m.main-none-eabihf: floats in FPU
# registers, so the C side must use the same (hard-float) ABI.
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# Peripherals
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_SENSOR=y
# Touch (the CAP1188, through Zephyr's CAP12xx input driver) and haptics
# (the DRV2605L).
CONFIG_INPUT=y
CONFIG_HAPTICS=y
CONFIG_FLASH=y
CONFIG_NFC_T2T_NRFXLIB=y
CONFIG_ENTROPY_GENERATOR=y

# BLE peripheral (DFU: MCUboot is turned on in sysbuild.conf)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Sugarcube"
CONFIG_BT_SMP=y

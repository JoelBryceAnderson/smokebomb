# Core
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Peripherals
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_FLASH=y
CONFIG_NFC_T2T_NRFXLIB=y
CONFIG_ENTROPY_GENERATOR=y

# BLE peripheral + DFU
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Smokebomb"
CONFIG_BT_SMP=y
CONFIG_BOOTLOADER_MCUBOOT=y

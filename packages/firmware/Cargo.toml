[package]
name = "smokebomb-firmware"
description = "Firmware image: wires the core to a concrete HAL chosen by feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Desktop simulator (std, mock peripherals)
simulator = ["dep:smokebomb-hal-simulator"]
# Production board (no_std, Zephyr)
nrf54l15 = ["dep:smokebomb-hal-nrf54l15"]
# With nrf54l15: build for the 30 mm die's 64x64 RGB panels (TARGET_30_RGB64)
# instead of the 34 mm die's 96x96 grey ones (TARGET_34_GREY96).
target-30-rgb64 = ["nrf54l15", "smokebomb-hal-nrf54l15/target-30-rgb64"]

[dependencies]
smokebomb-core.workspace = true
smokebomb-hal.workspace = true
smokebomb-hal-simulator = { workspace = true, optional = true }
smokebomb-hal-nrf54l15 = { workspace = true, optional = true }

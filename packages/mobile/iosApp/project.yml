# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && cd packages/mobile/iosApp && xcodegen generate
# The generated iosApp.xcodeproj is git-ignored; this file is the source of truth.
name: iosApp
options:
  bundleIdPrefix: com.smokebomb
  deploymentTarget:
    iOS: "16.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Smokebomb
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        NSBluetoothAlwaysUsageDescription: Smokebomb connects to your die over Bluetooth to sync and verify rolls.
        NFCReaderUsageDescription: Tap your die to pair it or join a verified session.
        UIBackgroundModes: [bluetooth-central]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smokebomb.app
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode

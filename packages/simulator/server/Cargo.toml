[package]
name = "smokebomb-simulator"
description = "Runs the real firmware core against the simulator HAL and serves the web UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "smokebomb-simulator"

[features]
default = ["simulator"]
simulator = ["smokebomb-firmware/simulator"]

[[bin]]
name = "smokebomb-simulator"
path = "src/main.rs"
required-features = ["simulator"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
getrandom.workspace = true
hex.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
smokebomb-firmware.workspace = true
smokebomb-hal.workspace = true
smokebomb-hal-simulator.workspace = true
smokebomb-shared.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

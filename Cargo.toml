[workspace]
resolver = "2"
members = [
    "packages/shared",
    "packages/firmware",
    "packages/firmware/core",
    "packages/firmware/hal",
    "packages/firmware/hal/simulator",
    "packages/firmware/hal/nrf54l15",
    "packages/firmware/zephyr/rust",
    "packages/firmware/assets-build",
    "packages/firmware/ffi",
    "packages/simulator/server",
    "packages/server",
]
# `cargo run --features=simulator` from the repo root launches the simulator.
# The backend server is left out so `cargo run` has exactly one binary to
# pick; build it with `-p smokebomb-server` or `--workspace`.
default-members = [
    "packages/shared",
    "packages/firmware",
    "packages/firmware/core",
    "packages/firmware/hal",
    "packages/firmware/hal/simulator",
    "packages/firmware/hal/nrf54l15",
    "packages/simulator/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Internal crates
smokebomb-shared = { path = "packages/shared" }
smokebomb-hal = { path = "packages/firmware/hal" }
smokebomb-core = { path = "packages/firmware/core" }
smokebomb-hal-simulator = { path = "packages/firmware/hal/simulator" }
smokebomb-hal-nrf54l15 = { path = "packages/firmware/hal/nrf54l15" }
smokebomb-firmware = { path = "packages/firmware", default-features = false }
smokebomb-assets-build = { path = "packages/firmware/assets-build" }

# no_std-friendly
heapless = { version = "0.8", features = ["serde"] }
libm = "0.2"
serde = { version = "1", default-features = false, features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

# std / host
anyhow = "1"
flate2 = "1"
fontdue = "0.9"
png = "0.17"
rustybuzz = "0.20"
axum = { version = "0.8", features = ["ws"] }
getrandom = "0.2"
glam = "0.33"
hex = "0.4"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tower-http = { version = "0.6", features = ["cors", "fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
lto = "thin"

# Build scripts rasterize the font pack; keep them fast in debug builds.
[profile.dev.build-override]
opt-level = 3

# The firmware core draws every panel pixel and runs the smoke particles; in
# a plain debug build a full cloud takes ~40 ms a tick, too slow for the
# simulator's 60 Hz. Optimise it even in dev builds (it stays debuggable).
[profile.dev.package.smokebomb-core]
opt-level = 3

# Firmware images: size matters more than speed.
[profile.firmware]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
